name: New customer verification checks
on:
  push:
    branches:
      - feature/new-customer-verification-20261117
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated customer verification tests
        run: node --test tests/new-customer-verification.test.cjs tests/new-customer-integration-contract.test.cjs tests/new-customer-proxy.test.mjs
