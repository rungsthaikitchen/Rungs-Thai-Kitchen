name: LEGACY payment integration checkout regression
on:
  push:
    branches:
      - integration/legacy-payment-current-main-2026-11-25
  pull_request:
    paths:
      - 'admin.html'
      - 'index.html'
      - 'legacy-payment-*.mjs'
      - 'customer-*.js'
      - 'tests/**'
      - '.github/workflows/legacy-payment-checkout-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checkout, customisation, delivery and menu regression tests
        run: |
          node --test \
            tests/checkout-reset.test.cjs \
            tests/customisation-dialog.test.cjs \
            tests/customisation-selectors.test.cjs \
            tests/delivery-quotes.test.cjs \
            tests/menu-overlay.test.cjs \
            tests/order-success-compat.test.cjs \
            tests/page-controls.test.cjs \
            tests/delivery-quote-refresh.test.cjs \
            tests/menu-spice.test.cjs \
            tests/customer-script-loading.test.cjs
