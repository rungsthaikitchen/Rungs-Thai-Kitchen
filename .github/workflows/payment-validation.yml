name: Payment validation tests

on:
  push:
    branches:
      - feature/payment-capture-complete
    paths:
      - 'tests/payment-validation.js'
      - 'tests/payment-validation.test.js'
      - '.github/workflows/payment-validation.yml'
  pull_request:
    paths:
      - 'tests/payment-validation.js'
      - 'tests/payment-validation.test.js'
      - '.github/workflows/payment-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-validation:
    name: Validate payment inputs (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run payment validation tests
        run: node --test tests/payment-validation.test.js
